services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-khemra-bro:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AI_KHEMRA_DATA_DIR: /var/lib/ai-khemra-bro
      LICENSE_DB_PATH: /var/lib/ai-khemra-bro/licenses.db
      HF_HOME: /home/appuser/.cache/huggingface
    volumes:
      - ai_khemra_data:/var/lib/ai-khemra-bro
      - ai_khemra_models:/home/appuser/.cache/huggingface
    expose:
      - "8501"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    mem_limit: 4g
    cpus: 2.0
    networks:
      - internal

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

volumes:
  ai_khemra_data:
  ai_khemra_models:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
