services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: matly-movie-store:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      STORE_DATA_DIR: /var/lib/ai-khemra-bro
    volumes:
      - ai_khemra_data:/var/lib/ai-khemra-bro
    expose: ["8501"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    mem_limit: 1g
    cpus: 1.0
    networks: [internal]
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      app:
        condition: service_healthy
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
volumes:
  ai_khemra_data:
  caddy_data:
  caddy_config:
networks:
  internal:
    driver: bridge
